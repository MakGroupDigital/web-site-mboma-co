<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TL = null;

// ---------- palette (charte MboMa & Co.) ----------
const C = {
  bg0: '#0A1A10', bg1: '#13311F', bg2: '#1B3D27',
  green: '#6E8F3A', lime: '#8BC34A', light: '#AFC18B',
  orange: '#E8902A', orangeD: '#C8742A', cream: '#F5F2E9', grey: '#3A3A3A'
};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// in/out envelope: fade in at a over din, fade out at b over dout
const io = (t, a, b, din = .45, dout = .35) => eOut(P(t, a, din)) * (1 - eIn(P(t, b - dout, dout)));

// word time lookup: W('seg','prefix')
function WT(seg, prefix, nth = 0) {
  let n = 0;
  for (const w of TL.words) if (w.seg === seg && w.text.toLowerCase().startsWith(prefix.toLowerCase())) { if (n === nth) return w.start; n++; }
  throw new Error('word not found ' + seg + ' ' + prefix);
}

// ---------- text helpers ----------
function font(f, size, weight = 600, style = '') {
  if (f === 'A') return `${size}px Anton`;
  if (f === 'B') return `italic ${size}px Bask`;
  return `${style} ${weight} ${size}px Mont`;
}
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.f || 'M', o.size || 40, o.w || 600);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.fillStyle = o.color || C.cream;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 30; }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.strokeText(s, x, y); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o = {}) {
  ctx.save(); ctx.font = font(o.f || 'M', o.size || 40, o.w || 600); ctx.letterSpacing = (o.ls || 0) + 'px';
  const m = ctx.measureText(s).width; ctx.restore(); return m;
}
// mask-reveal from below (classic motion-design text rise)
function rise(s, x, y, t, t0, o = {}) {
  const d = o.d || .6;
  const k = eExpo(P(t, t0, d));
  if (k <= 0) return;
  const size = o.size || 40;
  const out = o.out != null ? eIn(P(t, o.out, .4)) : 0;
  const w = measure(s, o) + 40;
  let x0 = x - 20; if (o.align === 'center') x0 = x - w / 2; if (o.align === 'right') x0 = x - w + 20;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y - size * 1.15, w, size * 1.45); ctx.clip();
  if (out >= 1) { ctx.restore(); return; }
  txt(s, x, y + (1 - k) * size * 1.25 - out * size * 1.3, { ...o, alpha: (o.alpha == null ? 1 : o.alpha) * (1 - out) });
  ctx.restore();
}
// per-word stagger rise
function riseWords(s, x, y, t, t0, o = {}) {
  const words = s.split(' ');
  const sp = measure(' ', o);
  let total = words.reduce((a, w) => a + measure(w, o), 0) + sp * (words.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : (o.align === 'right' ? x - total : x);
  words.forEach((w, i) => {
    rise(w, cx, y, t, t0 + i * (o.stag || .06), { ...o, align: 'left' });
    cx += measure(w, o) + sp;
  });
}
function typeOn(s, x, y, t, t0, cps, o = {}) {
  const n = Math.floor(clamp((t - t0) * cps, 0, s.length));
  if (n <= 0) return;
  txt(s.slice(0, n), x, y, o);
  if (n < s.length && Math.floor(t * 4) % 2 === 0) {
    const w = measure(s.slice(0, n), o);
    ctx.fillStyle = o.color || C.cream; ctx.fillRect(x + w + 4, y - (o.size || 40) * .8, 3, (o.size || 40) * .9);
  }
}

// ---------- shapes ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, col, lw = 2, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function bar(x, y, w, h, col, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); ctx.restore(); }

// paw (brand emblem), drawn on a 100x100 box centred at 50,50
function pawPath(c) {
  c.beginPath();
  c.ellipse(27, 42, 8.5, 11, -0.35, 0, Math.PI * 2);
  c.ellipse(41, 27, 9, 12, -0.12, 0, Math.PI * 2);
  c.ellipse(59, 27, 9, 12, 0.12, 0, Math.PI * 2);
  c.ellipse(73, 42, 8.5, 11, 0.35, 0, Math.PI * 2);
  c.moveTo(27, 64);
  c.bezierCurveTo(27, 52, 39, 47, 50, 47);
  c.bezierCurveTo(61, 47, 73, 52, 73, 64);
  c.bezierCurveTo(73, 75, 60, 86, 50, 88);
  c.bezierCurveTo(40, 86, 27, 75, 27, 64);
  c.closePath();
}
function drawPaw(cx, cy, size, col, a = 1, rot = 0, dotted = false) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(size / 100, size / 100); ctx.translate(-50, -50);
  pawPath(ctx); ctx.fillStyle = col; ctx.fill();
  if (dotted) {
    ctx.save(); pawPath(ctx); ctx.clip();
    ctx.fillStyle = 'rgba(10,40,20,0.28)';
    for (let yy = 14; yy < 92; yy += 4.2) for (let xx = 14; xx < 88; xx += 4.2) {
      const r = 0.55 + 0.9 * ((yy - 14) / 78);
      ctx.beginPath(); ctx.arc(xx + ((yy / 4.2) % 2) * 2.1, yy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}
// full emblem with double ring, ring drawn progressively by k
function emblem(cx, cy, R, k, a = 1, col = C.lime) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = R * 0.045;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eIO(clamp(k * 1.25)), false); ctx.stroke();
  ctx.lineWidth = R * 0.02;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.88, Math.PI / 2, Math.PI / 2 + Math.PI * 2 * eIO(clamp(k * 1.25 - .15)), false); ctx.stroke();
  const pk = eBack(clamp(k * 1.6 - .45));
  if (pk > 0) drawPaw(cx, cy + R * .02, R * 1.3 * pk, col, clamp(pk), 0, true);
  ctx.restore();
}

// ---------- images ----------
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = src; }); }

// ---------- Africa (approximate outline, lon/lat) ----------
const AFR = [[-5.9, 35.8], [-1, 35.1], [3, 36.8], [10.2, 37.2], [11, 35.2], [10.1, 33.8], [11.5, 33], [13.2, 32.9], [15.5, 31.5], [19.9, 30.9], [20.1, 32.1], [23.1, 32.6], [25.2, 31.6], [29.9, 31.2], [32.3, 31.3], [34.2, 31.2], [32.6, 30], [33.6, 27.2], [35.5, 23.9], [37.2, 21], [38.6, 18], [39.7, 15.6], [41.7, 13.5], [43.3, 12.6], [44, 10.6], [45.5, 10.6], [51.2, 11.8], [51, 10.4], [49.1, 6], [47.9, 4.4], [46, 2], [43.5, -0.6], [41.6, -1.7], [39.7, -4.2], [39.3, -6.8], [40.4, -10.5], [40.6, -14.5], [40.1, -16.2], [36.9, -17.9], [35.3, -21.3], [35.5, -23.7], [32.9, -25.9], [32.6, -28.6], [31, -29.9], [28, -32.9], [25.6, -34], [20, -34.8], [18.4, -34.2], [18, -32], [16.5, -28.6], [15.2, -26.6], [14.5, -22.9], [13.4, -20.9], [11.8, -17.2], [12, -13], [13.6, -11.5], [13.2, -8.8], [12.2, -6], [11.8, -4.8], [9.4, -0.7], [9.3, 0.4], [9.6, 2.8], [9.8, 3.9], [8.5, 4.5], [6, 4.3], [4.5, 6.3], [3.4, 6.4], [1.2, 6.1], [-2, 4.8], [-4, 5.3], [-7.5, 4.4], [-9.5, 5.5], [-11, 6.8], [-13.2, 8.5], [-15, 11], [-16.8, 12.5], [-17.1, 14.7], [-16.5, 16.5], [-16.1, 19.5], [-16.9, 21.3], [-14.5, 26.1], [-12, 28], [-9.8, 29.5], [-9.6, 30.4], [-8.5, 33.3], [-6.8, 34], [-5.9, 35.8]];
const MADA = [[49.3, -12], [50.4, -15.5], [49.7, -17], [47.1, -25], [45.2, -25.5], [43.6, -23.5], [44.1, -20.5], [44.4, -16.3], [46.3, -15.7], [48, -13.6], [49.3, -12]];
const CITIES = { kin: [15.3, -4.3], bzv: [15.25, -4.25], lub: [27.5, -11.7], dkr: [-17.4, 14.7], abj: [-4, 5.3], los: [3.4, 6.5], dla: [9.7, 4.05], lbv: [9.45, 0.4], nbo: [36.8, -1.3], kgl: [30.1, -1.95], add: [38.7, 9.0], acc: [-0.2, 5.6], jnb: [28, -26.2], cai: [31.2, 30], cas: [-7.6, 33.6], lad: [13.2, -8.8] };
function inPoly(x, y, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}
let AFR_DOTS = [];
function buildAfrica() {
  const step = 1.25;
  for (let lat = 38; lat > -36; lat -= step) for (let lon = -19; lon < 53; lon += step) {
    if (inPoly(lon, lat, AFR) || inPoly(lon, lat, MADA)) AFR_DOTS.push([lon, lat, hash(AFR_DOTS.length)]);
  }
}
// project lon/lat into a box centred at cx,cy with height h
function proj(lon, lat, cx, cy, h) { const s = h / 74; return [cx + (lon - 17) * s, cy - (lat - 1) * s]; }
function drawAfrica(t, cx, cy, h, k, o = {}) {
  const s = h / 74, r0 = s * (o.dot || .42);
  const r = rnd(11);
  ctx.save();
  for (let i = 0; i < AFR_DOTS.length; i++) {
    const [lon, lat, hv] = AFR_DOTS[i];
    const [x, y] = proj(lon, lat, cx, cy, h);
    const kk = eOut(clamp(k * 1.6 - hv * .6));
    if (kk <= 0) continue;
    const sx = lerp(x + (hash(i * 3.1) - .5) * 1400, x, kk), sy = lerp(y + (hash(i * 7.3) - .5) * 900, y, kk);
    const pulse = .55 + .45 * Math.sin(t * 1.4 + lon * .15 + lat * .1);
    let col = o.col || C.green;
    if (o.highlight && o.highlight(lon, lat)) col = C.lime;
    ctx.globalAlpha = kk * (o.alpha || .9) * (.55 + .45 * pulse);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sx, sy, r0 * (.7 + .3 * pulse), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function arcLink(x1, y1, x2, y2, k, col, lw = 2, lift = .35) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - Math.hypot(x2 - x1, y2 - y1) * lift;
  const N = 40, n = Math.floor(N * clamp(k));
  if (n < 1) return;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const u = i / N; const x = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2; const y = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  const u = n / N; const hx = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2, hy = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2;
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(hx, hy, lw * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function cityPin(x, y, t, a, col = C.orange, r = 6) {
  ctx.save(); ctx.globalAlpha *= a;
  const ph = (t * .8) % 1;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha *= (1 - ph);
  ctx.beginPath(); ctx.arc(x, y, r + ph * 26, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// ---------- background / global layers ----------
let GRAIN = [];
function buildGrain() {
  for (let g = 0; g < 6; g++) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    const id = x.createImageData(256, 256); const r = rnd(100 + g);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    x.putImageData(id, 0, 0); GRAIN.push(c);
  }
}
function background(t, tone = 0) {
  const g = ctx.createRadialGradient(W * .62, H * .45, 50, W * .5, H * .5, W * .85);
  g.addColorStop(0, tone ? '#1E4A2C' : C.bg2); g.addColorStop(.55, C.bg1); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // fine institutional grid
  ctx.save(); ctx.globalAlpha = .045; ctx.strokeStyle = C.light; ctx.lineWidth = 1;
  const off = (t * 12) % 80;
  for (let x = -80 + off; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // drifting particles
  ctx.save();
  for (let i = 0; i < 70; i++) {
    const x = (hash(i) * W + t * (8 + hash(i + 9) * 20)) % W, y = (hash(i + 50) * H - t * (4 + hash(i + 3) * 10) + H * 10) % H;
    ctx.globalAlpha = .08 + .18 * hash(i + 77); ctx.fillStyle = i % 7 === 0 ? C.orange : C.light;
    ctx.beginPath(); ctx.arc(x, y, 1 + hash(i + 5) * 2.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function postFX(t) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grain
  const f = Math.floor(t * 30);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  const gimg = GRAIN[f % GRAIN.length];
  const ox = (f * 73) % 256, oy = (f * 151) % 256;
  ctx.translate(-ox, -oy);
  for (let x = 0; x < W + 256; x += 256) for (let y = 0; y < H + 256; y += 256) ctx.drawImage(gimg, x, y);
  ctx.restore();
}
// chapter tag top-left
function chapter(t, sc, num, label) {
  const a = io(t, sc.start + .25, sc.end, .5, .3);
  if (a <= 0) return;
  const k = eExpo(P(t, sc.start + .25, .8));
  ctx.save(); ctx.globalAlpha = a;
  bar(96, 92, 4, 44, C.orange);
  txt(num, 120, 128, { f: 'A', size: 40, color: C.orange });
  const nw = measure(num, { f: 'A', size: 40 });
  line(120 + nw + 16, 112, 120 + nw + 16 + 60 * k, 112, C.light, 2, .6);
  rise(label, 120 + nw + 92, 124, t, sc.start + .35, { size: 22, w: 700, ls: 6, color: C.cream, d: .6 });
  ctx.restore();
}
// TV-style brand bug bottom-right
function bug(t) {
  const a = io(t, 2.2, TL.scenes.find(s => s.id === 'logo').start, .8, .4) * .75;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  drawPaw(1640, 1000, 36, C.lime, 1);
  ctx.strokeStyle = C.lime; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(1640, 1000, 24, 0, Math.PI * 2); ctx.stroke();
  line(1674, 984, 1674, 1016, C.orange, 1.5);
  txt('MboMa & Co.', 1686, 1008, { size: 21, w: 600, color: C.cream, ls: 1 });
  ctx.restore();
}
// lower third label
function lowerThird(t, t0, t1, title, sub) {
  const a = io(t, t0, t1, .4, .3); if (a <= 0) return;
  const k = eExpo(P(t, t0, .7));
  ctx.save(); ctx.globalAlpha = a;
  const w = Math.max(measure(title, { f: 'A', size: 46, ls: 1 }), measure(sub || '', { size: 22, w: 600, ls: 3 })) + 80;
  ctx.fillStyle = 'rgba(8,24,14,0.82)'; ctx.fillRect(96, 830, w * k, 130);
  bar(96, 830, 8, 130, C.orange);
  if (k > .3) {
    rise(title, 130, 892, t, t0 + .15, { f: 'A', size: 46, color: C.cream, ls: 1 });
    if (sub) rise(sub, 132, 934, t, t0 + .3, { size: 22, w: 600, ls: 3, color: C.lime });
  }
  ctx.restore();
}

// ---------- transition: brand bars wipe ----------
function wipe(t, B) {
  const d = .62, t0 = B - d / 2;
  const u = (t - t0) / d; if (u < 0 || u > 1.25) return;
  const cols = [C.lime, C.orange, C.bg0];
  cols.forEach((col, i) => {
    const uu = clamp((u - i * .1) / 1);
    if (uu <= 0 || uu >= 1) return;
    const x = lerp(-W * 1.6, W * 1.25, eIO(uu));
    ctx.save(); ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + W * 1.25, 0); ctx.lineTo(x + W * 1.25 - 300, H); ctx.lineTo(x - 300, H); ctx.closePath(); ctx.fill();
    if (i === 2) drawPaw(x + W * .62, H / 2, 140, C.green, .5);
    ctx.restore();
  });
}

// =====================================================================
//                               SCENES
// =====================================================================
const S = {};

// 1 — INTRO -----------------------------------------------------------
S.intro = (t, sc) => {
  // speed streaks: "un monde qui s'accélère"
  const sa = io(t, 0, 3.4, .6, .9);
  ctx.save();
  for (let i = 0; i < 46; i++) {
    const y = hash(i) * H, len = 200 + hash(i + 3) * 600, sp = 900 + hash(i + 7) * 2600;
    const x = W - ((t * sp + hash(i + 11) * 4000) % (W + len + 400));
    ctx.globalAlpha = sa * (.08 + .25 * hash(i + 2));
    const g = ctx.createLinearGradient(x, 0, x + len, 0);

// simple line icons
function icon(name, x, y, s, col, t) {

    ctx.beginPath(); ctx.moveTo(-h, -h * .35); ctx.lineTo(0, -h); ctx.lineTo(h, -h * .35); ctx.closePath(); ctx.stroke();
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * h * .4, -h * .2); ctx.lineTo(i * h * .4, h * .65); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-h, h * .85); ctx.lineTo(h, h * .85); ctx.stroke();
  } else if (name === 'gear') {
    ctx.rotate(t * .8);
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-h * .14, -h * 1.0, h * .28, h * .35); }
    ctx.beginPath(); ctx.arc(0, 0, h * .68, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, h * .26, 0, Math.PI * 2); ctx.stroke();
  } else if (name === 'search') {
    ctx.beginPath(); ctx.arc(-h * .15, -h * .15, h * .55, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h * .25, h * .25); ctx.lineTo(h * .8, h * .8); ctx.stroke();
  } else if (name === 'check') {
    rr(-h * .7, -h * .9, h * 1.4, h * 1.8, 6); ctx.stroke();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-h * .4, -h * .45 + i * h * .5); ctx.lineTo(-h * .25, -h * .3 + i * h * .5); ctx.lineTo(0, -h * .6 + i * h * .5); ctx.stroke(); ctx.beginPath(); ctx.moveTo(h * .12, -h * .45 + i * h * .5); ctx.lineTo(h * .45, -h * .45 + i * h * .5); ctx.stroke(); }
  } else if (name === 'blueprint') {
    rr(-h * .9, -h * .7, h * 1.8, h * 1.4, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-h * .9, 0); ctx.lineTo(h * .1, 0); ctx.lineTo(h * .1, h * .7); ctx.moveTo(h * .1, -h * .7); ctx.lineTo(h * .1, -h * .3); ctx.moveTo(h * .1, 0); ctx.lineTo(h * .9, 0); ctx.stroke();
  } else if (name === 'rocket') {
    ctx.rotate(-Math.PI / 4);
    ctx.beginPath(); ctx.moveTo(0, -h); ctx.quadraticCurveTo(h * .45, -h * .4, h * .3, h * .45); ctx.lineTo(-h * .3, h * .45); ctx.quadraticCurveTo(-h * .45, -h * .4, 0, -h); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -h * .25, h * .14, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-h * .3, h * .2); ctx.lineTo(-h * .6, h * .65); ctx.lineTo(-h * .3, h * .45); ctx.moveTo(h * .3, h * .2); ctx.lineTo(h * .6, h * .65); ctx.lineTo(h * .3, h * .45); ctx.stroke();
    ctx.globalAlpha *= .5 + .5 * Math.sin(t * 20); ctx.beginPath(); ctx.moveTo(-h * .15, h * .55); ctx.lineTo(0, h * .95); ctx.lineTo(h * .15, h * .55); ctx.fill();
  } else if (name === 'user') {
    ctx.beginPath(); ctx.arc(0, -h * .35, h * .38, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, h * .9, h * .8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  ctx.restore();
}

    ctx.fillStyle = '#4e5a50'; ctx.beginPath(); ctx.arc(0, -150, 22, 0, Math.PI * 2); ctx.fill(); rr(-30, -125, 60, 110, 20); ctx.fill();
    const sw = Math.sin(lt * 8 + k) * 10; ctx.fillRect(-22 + sw * .5, -20, 16, 60); ctx.fillRect(6 - sw * .5, -20, 16, 60);
    ctx.restore();
    const bw = 110 * s, bh = 230 * s;
    const det = eOut(clamp((lt - .2 - k * .2) / .3));
    if (det > 0) {
      ctx.save(); ctx.globalAlpha = det; ctx.strokeStyle = k === 1 ? C.orange : C.lime; ctx.lineWidth = 3;
      ctx.strokeRect(x - bw / 2, y - bh + 30 * s, bw, bh);
      ctx.fillStyle = k === 1 ? C.orange : C.lime; ctx.fillRect(x - bw / 2, y - bh + 30 * s - 30, Math.max(bw, 170), 30);
      txt((k === 1 ? 'ID #A-27 ' : 'PERSONNE ') + (94 + k).toFixed(0) + '%', x - bw / 2 + 8, y - bh + 30 * s - 8, { size: 18, w: 800, color: '#0a1a10' });
      ctx.restore();
    }
  });
  scanlines(.12);
  hud(60, 60, W - 120, H - 120, C.light);
  ctx.fillStyle = '#e53935'; if (Math.floor(t * 2) % 2 === 0) { ctx.beginPath(); ctx.arc(120, 130, 12, 0, Math.PI * 2); ctx.fill(); }
  txt('REC', 145, 140, { size: 28, w: 800, color: C.cream });
  txt('CAM 04 · IA ACTIVE', W - 110, 140, { size: 24, w: 700, ls: 3, color: C.lime, align: 'right' });
  const sec = 37 + Math.floor(lt);
  txt('2025-11-14  21:42:' + String(sec).padStart(2, '0'), W - 110, 180, { size: 22, w: 600, ls: 2, color: C.light, align: 'right' });
}
function footClara(lt, t) {
  ctx.fillStyle = '#071510'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = 470;
  // neural core
  for (let k = 0; k < 3; k++) { ctx.save(); ctx.strokeStyle = k === 1 ? C.orange : C.lime; ctx.globalAlpha = .5; ctx.lineWidth = 2; ctx.translate(cx, cy); ctx.rotate(lt * (k + 1) * .4 * (k % 2 ? -1 : 1)); ctx.setLineDash([20, 14]); ctx.beginPath(); ctx.arc(0, 0, 120 + k * 40, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 110); g.addColorStop(0, 'rgba(139,195,74,0.9)'); g.addColorStop(1, 'rgba(139,195,74,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 110, 0, Math.PI * 2); ctx.fill();
  txt('CLARA', cx, cy + 6, { f: 'A', size: 76, color: C.cream, align: 'center', glow: C.lime });
  txt('AI', cx, cy + 62, { f: 'A', size: 40, color: C.orange, align: 'center' });
  // CV cards streaming in from left → sorted right
  for (let k = 0; k < 40; k++) {
    const u = (lt * (.55 + lt * .25) + hash(k)) % 1;
    const lane = Math.floor(hash(k + 3) * 5);
    let x, y;
    if (u < .5) { const v = u / .5; x = lerp(-120, cx - 150, eIn(v)); y = lerp(220 + lane * 120, cy, eIn(v)); }
    else { const v = (u - .5) / .5; const good = hash(k + 7) > .55; x = lerp(cx + 150, W + 120, eOut(v)); y = lerp(cy, good ? 300 + lane * 25 : 640 + lane * 25, eOut(v)); }
    ctx.save(); ctx.globalAlpha = Math.sin(u * Math.PI) * .95; ctx.translate(x, y);
    ctx.fillStyle = '#F2EFE6'; rr(-40, -52, 80, 104, 6); ctx.fill();
    ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(0, -26, 12, 0, Math.PI * 2); ctx.fill();
    for (let l = 0; l < 3; l++) bar(-28, -4 + l * 14, 56 - l * 10, 6, '#b5b2a8');
    if (u > .5) { ctx.fillStyle = hash(k + 7) > .55 ? C.lime : C.orange; ctx.beginPath(); ctx.arc(30, -42, 11, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  txt('PROFILS RETENUS', W - 160, 260, { size: 20, w: 800, ls: 4, color: C.lime, align: 'right' });
  txt('ANALYSE SÉMANTIQUE · PRÉDICTIVE · NEURONALE', cx, 760, { size: 22, w: 700, ls: 5, color: C.light, align: 'center' });
  // counter
  const tm = WT('terrain', 'million') - (TL._terrainClaraStart);
  const n = Math.round(1000000 * eOut(clamp((lt - (tm - 1.6)) / 1.7)));
  const s = n.toLocaleString('fr-FR').replace(/ | /g, ' ');
  txt(s, cx, 900, { f: 'A', size: 120, color: C.cream, align: 'center', alpha: eOut(clamp((lt - (tm - 1.8)) / .3)) });
  rise('CV PAR MINUTE', cx, 960, t, WT('terrain', 'cv') - .15, { size: 30, w: 800, ls: 10, color: C.orange, align: 'center' });
}

// 7 — IMPACT --------------------------------------------------------------
S.impact = (t, sc) => {
  chapter(t, sc, '05', 'IMPACT 2025');
  const t25 = WT('impact', '2025');
  // giant outlined 2025
  const k = eExpo(P(t, t25 - .2, 1));
  ctx.save(); ctx.globalAlpha = .16 * k * (1 - eIn(P(t, sc.end - .4, .4)));
  txt('2025', W / 2 + (1 - k) * 200, 760, { f: 'A', size: 640, stroke: C.lime, lw: 3, align: 'center' });
  ctx.restore();
  rise('EN 2025', 140, 250, t, t25 - .15, { f: 'A', size: 56, color: C.orange });
  const stats = [
    { v: 26, suf: '', a: 'PROJETS', b: 'STRUCTURANTS', t: WT('impact', 'vingt-six') },
    { v: 12, suf: '', a: 'PAYS', b: 'PARTENAIRES', t: WT('impact', 'douze') },
    { v: 150, suf: '+', a: 'SOLUTIONS', b: 'TECHNOLOGIQUES', t: WT('impact', 'plus') },
    { v: 85, suf: '%', a: "D'EXPERTISE", b: 'LOCALE', t: WT('impact', 'quatre-vingt-cinq') },
  ];
  stats.forEach((s, i) => {
    const x = 140 + (i % 2) * 470, y = 330 + Math.floor(i / 2) * 290;
    const kk = eExpo(P(t, s.t - .25, .7)); if (kk <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(kk);
    ctx.fillStyle = 'rgba(12,34,20,0.85)'; rr(x, y + (1 - kk) * 40, 440, 260, 16); ctx.fill();
    bar(x, y + (1 - kk) * 40, 6, 260, i % 2 ? C.orange : C.lime);
    const n = Math.round(s.v * eOut(P(t, s.t - .2, 1.1)));
    txt(n + s.suf, x + 40, y + 150 + (1 - kk) * 40, { f: 'A', size: 130, color: i % 2 ? C.orange : C.lime });
    txt(s.a, x + 40, y + 200 + (1 - kk) * 40, { size: 24, w: 800, ls: 4, color: C.cream });
    txt(s.b, x + 40, y + 232 + (1 - kk) * 40, { size: 24, w: 500, ls: 4, color: C.light });
    ctx.restore();
  });
  // right: annual report cover then 90% ring
  const t90 = WT('impact', 'quatre-vingt-dix');
  const rc = IMG.report;
  const ra = io(t, t25 - .1, t90 + .1, .6, .45);
  if (rc && ra > 0) {
    const kk = eExpo(P(t, t25 - .1, 1));
    ctx.save(); ctx.globalAlpha = ra; ctx.translate(1450, 560 + (1 - kk) * 120); ctx.rotate(.06 - .03 * P(t, t25, 9));
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    const hh = 640, ww = hh * rc.width / rc.height;
    ctx.drawImage(rc, -ww / 2, -hh / 2, ww, hh);
    ctx.restore();
    rise('RAPPORT ANNUEL 2025', 1450, 950, t, t25 + .3, { size: 22, w: 800, ls: 6, color: C.light, align: 'center', out: t90 - .3 });
  }
  const gk = eOut(P(t, t90 - .1, 1.3));
  if (t > t90 - .2) {
    const gx = 1460, gy = 560, R = 250;
    const a = io(t, t90 - .2, sc.end, .4, .35);
    ctx.save(); ctx.globalAlpha = a;
    ctx.lineWidth = 34; ctx.strokeStyle = 'rgba(175,193,139,0.15)'; ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = C.lime; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(gx, gy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * .9 * gk); ctx.stroke();
    txt(Math.round(90 * gk) + '%', gx, gy + 50, { f: 'A', size: 170, color: C.cream, align: 'center' });
    ctx.restore();
    rise('DE NOS PARTENAIRES', gx, gy + R + 90, t, WT('impact', 'partenaires', 0) - .1, { size: 24, w: 800, ls: 5, color: C.light, align: 'center' });
    rise('RENOUVELLENT LEUR CONFIANCE', gx, gy + R + 130, t, WT('impact', 'renouvellent') - .1, { size: 24, w: 800, ls: 5, color: C.orange, align: 'center' });
  }
};

// 8 — VALEURS -------------------------------------------------------------
S.valeurs = (t, sc) => {
  chapter(t, sc, '06', 'NOS VALEURS');
  const tN = WT('valeurs', 'nous');
  const vals = [['RIGUEUR.', WT('valeurs', 'rigueur'), C.cream], ['INTÉGRITÉ.', WT('valeurs', 'intégrité'), C.lime], ['SOUVERAINETÉ AFRICAINE.', WT('valeurs', 'souveraineté'), C.orange]];
  const out = tN - .25;
  vals.forEach(([w, ti, col], i) => {
    if (t > out + .6) return;
    const k = eOut(P(t, ti - .08, .35));
    if (k <= 0) return;
    const sh = (1 - P(t, ti, .25)) * 10 * Math.sin(t * 90);
    const s = lerp(1.6, 1, k);
    const o = eIn(P(t, out, .45));
    ctx.save(); ctx.globalAlpha = k * (1 - o); ctx.translate(W / 2 + sh, 400 + i * 170 - o * 120); ctx.scale(s, s);
    txt(w, 0, 0, { f: 'A', size: i === 2 ? 130 : 160, color: col, align: 'center' });
    ctx.restore();
  });
  // humain au coeur
  const tH = WT('valeurs', "l'humain");
  const hk = eBack(P(t, tH - .3, .7));
  const ta = WT('valeurs', 'afrique');
  const mv = eIO(P(t, ta - .4, .9));
  if (hk > 0) {
    const hx = lerp(W / 2, 560, mv), hy = lerp(470, 520, mv);
    ctx.save(); ctx.globalAlpha = clamp(hk) * (1 - eIn(P(t, sc.end - .35, .35)));
    // orbiting data nodes
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * Math.PI * 2 + t * .5, r = 190 + (k % 2) * 50;
      const x = hx + Math.cos(a) * r * hk, y = hy + Math.sin(a) * r * .55 * hk;
      line(hx, hy, x, y, C.green, 1.5, .4);
      ctx.fillStyle = k % 3 ? C.lime : C.orange; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = C.bg1; ctx.beginPath(); ctx.arc(hx, hy, 110 * hk, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.lime; ctx.lineWidth = 4; ctx.stroke();
    icon('user', hx, hy + 10, 130 * hk, C.cream, t);
    ctx.restore();
    const tx = lerp(W / 2, 1180, mv), al = mv > .5 ? 'center' : 'center';
    rise("L'HUMAIN", W / 2, 700, t, tH - .1, { f: 'A', size: 96, color: C.cream, align: 'center', out: ta - .5 });
    rise('au cœur de la transformation numérique', W / 2, 770, t, WT('valeurs', 'cœur') - .1, { f: 'B', size: 44, color: C.light, align: 'center', out: ta - .45 });
  }
  if (mv > 0) {
    const tx = 1180;
    rise('UNE AFRIQUE', tx, 470, t, ta - .1, { f: 'A', size: 64, color: C.cream, align: 'center', out: sc.end - .35 });
    rise('STRUCTURÉE · COMPÉTITIVE', tx, 540, t, WT('valeurs', 'structurée') - .1, { size: 34, w: 800, ls: 6, color: C.lime, align: 'center', out: sc.end - .35 });
    const tz = WT('valeurs', "l'horizon");
    rise("À L'HORIZON", tx, 640, t, tz - .1, { size: 26, w: 800, ls: 10, color: C.light, align: 'center', out: sc.end - .35 });
    const yk = eOut(P(t, WT('valeurs', '2050') - .5, 1.0));
    if (yk > 0) {
      const yr = Math.round(lerp(2025, 2050, yk));
      ctx.save(); ctx.globalAlpha = 1 - eIn(P(t, sc.end - .35, .35));
      txt(String(yr), tx, 840, { f: 'A', size: 210, color: C.orange, align: 'center', glow: 'rgba(232,144,42,0.5)', glowB: 40 });
      ctx.restore();
    }
  }
};

// 9 — LOGO ----------------------------------------------------------------
S.logo = (t, sc) => {
  const t0 = sc.start + .35;
  // light burst
  const fl = Math.max(0, 1 - Math.abs(t - t0) / .25);
  ctx.save(); ctx.translate(W / 2, 400); ctx.rotate(t * .08);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI / 12); ctx.globalAlpha = .05 + .05 * Math.sin(i); ctx.fillStyle = i % 2 ? C.lime : C.orange; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1400, -30); ctx.lineTo(1400, 30); ctx.fill(); }
  ctx.restore();
  const k = P(t, t0 - .25, 1.2);
  emblem(W / 2, 380, 170, k, 1);
  const wk = eExpo(P(t, WT('logo', 'mboma') - .1, .8));
  ctx.save(); ctx.globalAlpha = wk;
  const s1 = 'MboMa', s2 = ' & Co.';
  const w1 = measure(s1, { size: 110, w: 600 }), w2 = measure(s2, { size: 90, w: 500 });
  const x0 = W / 2 - (w1 + w2) / 2;
  txt(s1, x0, 690 + (1 - wk) * 40, { size: 110, w: 600, color: C.lime });
  txt(s2, x0 + w1, 690 + (1 - wk) * 40, { size: 90, w: 500, color: C.cream });
  ctx.restore();
  rise('ÉLEVER LES STANDARDS.', W / 2 - 20, 820, t, WT('logo', 'élevez') - .1, { f: 'A', size: 72, color: C.cream, align: 'right' });
  rise("CRÉER L'IMPACT.", W / 2 + 20, 820, t, WT('logo', 'créez') - .1, { f: 'A', size: 72, color: C.orange, align: 'left' });
  ctx.save(); ctx.globalAlpha = fl; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore();
};

// 10 — TRACE + END CARD ----------------------------------------------------
S.trace = (t, sc) => drawTrace(t, sc.start, false);
S.endcard = (t, sc) => drawTrace(t, TL.scenes.find(s => s.id === 'trace').start, true);
function drawTrace(t, t0, end) {
  // paw-print trail walking across the screen
  const n = 14;
  for (let i = 0; i < n; i++) {
    const ti = t0 + .2 + i * .22;
    const a = eOut(P(t, ti, .3)) * (1 - .6 * P(t, ti + 1.5, 2.5));
    if (a <= 0) continue;
    const x = 120 + i * 130, y = 900 + (i % 2 ? -40 : 40) - i * 6;
    drawPaw(x, y, 70, i % 4 === 3 ? C.orange : C.lime, a * .85, Math.PI / 2 + (i % 2 ? .12 : -.12));
  }
  const fadeQ = end ? eIn(P(t, TL.scenes.find(s => s.id === 'endcard').start - .1, .5)) : 0;
  ctx.save(); ctx.globalAlpha = 1 - fadeQ;
  rise('Nous ne faisons pas du bruit.', W / 2, 420, t, WT('trace', 'nous') - .1, { f: 'B', size: 74, color: C.cream, align: 'center' });
  rise('Nous laissons une trace.', W / 2, 540, t, WT('trace', 'nous', 1) - .1, { f: 'B', size: 74, color: C.orange, align: 'center' });
  ctx.restore();
  if (end) {
    const te = TL.scenes.find(s => s.id === 'endcard').start;
    const k = P(t, te + .1, 1.1);
    emblem(W / 2 - 330, 420, 120, k, 1);
    bar(W / 2 - 170, 420 - 90 * eExpo(k), 4, 180 * eExpo(k), C.orange);
    ctx.save(); ctx.globalAlpha = eExpo(P(t, te + .4, .8));
    txt('MboMa', W / 2 - 130, 455, { size: 104, w: 600, color: C.lime });
    txt('& Co.', W / 2 - 130 + measure('MboMa ', { size: 104, w: 600 }), 455, { size: 84, w: 500, color: C.cream });
    ctx.restore();
    rise('ÉLEVER LES STANDARDS. CRÉER L\'IMPACT.', W / 2, 610, t, te + .6, { size: 26, w: 800, ls: 8, color: C.light, align: 'center' });
    rise('www.mboma.org', W / 2, 700, t, te + .8, { size: 48, w: 700, color: C.cream, align: 'center' });
    rise('BRAZZAVILLE  ·  KINSHASA  ·  PARIS', W / 2, 760, t, te + 1, { size: 22, w: 700, ls: 8, color: C.orange, align: 'center' });
  }
}

// =====================================================================
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  // find scene (render previous one too during its exit overlap is handled by wipe)
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  ctx.save(); S[sc.id](t, sc); ctx.restore();
  bug(t);
  // transitions
  TL.scenes.forEach((s, i) => { if (i > 0 && !['endcard', 'trace', 'logo'].includes(s.id)) wipe(t, s.start); });
  postFX(t);
  // opening fade-in & closing fade-out
  const fin = 1 - P(t, 0, .8), fout = P(t, TL.total - .9, .9);
  const f = Math.max(fin, fout);
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}

window.init = async (tl) => {
  TL = tl;
  TL._terrainClaraStart = WT('terrain', 'clara') - .3;
  buildAfrica(); buildGrain();
  await Promise.all([loadImg('founder', 'assets/founder.jpg'), loadImg('report', 'assets/report_cover-01.png')]);
  await Promise.all(['40px Anton', 'italic 40px Bask', '400 40px Mont', '500 40px Mont', '600 40px Mont', '700 40px Mont', '800 40px Mont'].map(f => document.fonts.load(f, 'ÉàçMboMa')));
  return { dots: AFR_DOTS.length, fonts: document.fonts.size };
};
window.renderFrame = renderFrame;
window.grab = (t, q) => { renderFrame(t); return cv.toDataURL('image/jpeg', q || 0.93); };
</script>
